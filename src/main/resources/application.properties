spring.application.name=anilog

spring.datasource.url=${ANILOG_SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${ANILOG_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${ANILOG_SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
