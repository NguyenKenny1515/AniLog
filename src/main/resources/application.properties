spring.application.name=anilog

spring.datasource.url=${ANILOG_SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${ANILOG_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${ANILOG_SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.main.banner-mode=off

anilog.default_profile_pic=https://res.cloudinary.com/dmzamfvly/image/upload/v1742401957/Default-Profile-Picture.png

spring.mvc.hiddenmethod.filter.enabled=true