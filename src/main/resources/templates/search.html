<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Anime - AniLog</title>

    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <script th:src="@{/js/anime-search.js}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h1 class="text-center mb-4">Anime Search</h1>

    <div th:replace="~{fragments/search-bar :: search-bar}"></div>

    <table class="table table-bordered table-striped table-hover">
        <thead>
        <tr>
            <th></th>
            <th>Title</th>
            <th>Type</th>
            <th>Episodes</th>
            <th>Score</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="anime : ${results}">
            <td>
                <a th:href="@{/anime/{id}(id=${anime.malId})}">
                    <img th:src="${anime.images.webp.imageUrl}" th:alt="${anime.title}" class="img-fluid"
                         width="150" height="200">
                </a>
            </td>
            <td>
                <a th:href="@{/anime/{id}(id=${anime.malId})}" class="text-decoration-none">
                    <strong th:text="${anime.title}"></strong>
                </a>
                <p th:text="${#strings.abbreviate(anime.synopsis, 200)}"></p>
            </td>
            <td th:text="${anime.type} ?: 'N/A'"></td>
            <td th:text="${anime.episodes} ?: '-'"></td>
            <td th:text="${anime.score != 0} ? ${anime.score} : 'N/A'"></td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-center align-items-center mt-4">
        <div>
            <a th:if="${pagination.currentPage > 1}"
               th:href="@{/anime/search(q=${query}, page=${pagination.currentPage - 1})}"
               class="btn btn-outline-primary btn-sm me-2">Previous</a>
        </div>
        <div class="text-center">
            <span class="fw-bold">
                <span th:text="${pagination.currentPage}"></span> /
                <span th:text="${pagination.lastVisiblePage}"></span>
            </span>
        </div>
        <div>
            <a th:if="${pagination.hasNextPage}"
               th:href="@{/anime/search(q=${query}, page=${pagination.currentPage + 1})}"
               class="btn btn-outline-primary btn-sm ms-2">Next</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
