<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Anime - AniLog</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script th:src="@{/js/anime-search.js}" defer></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Anime Search</h1>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="input-group mb-3">
                <input type="text" id="anime-search-bar" class="form-control form-control-lg"
                       placeholder="Search Anime..."
                       aria-label="Search Anime" aria-describedby="search-addon" onkeyup="searchAnime()">
                <div id="anime-results-dropdown" class="dropdown-menu" aria-labelledby="search-addon"></div>
            </div>
        </div>
    </div>


    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th></th>
            <th>Title</th>
            <th>Type</th>
            <th>Episodes</th>
            <th>Score</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="anime : ${results}">
            <td>
                <a th:href="@{/anime/{id}(id=${anime.malId})}">
                    <img th:src="${anime.images.webp.imageUrl}" th:alt="${anime.title}" class="img-fluid rounded"
                         width="150" height="200">
                </a>
            </td>
            <td>
                <a th:href="@{/anime/{id}(id=${anime.malId})}">
                    <strong th:text="${anime.title}"></strong>
                </a>
                <p th:text="${#strings.abbreviate(anime.synopsis, 150)}">...read more</p>
            </td>
            <td th:text="${anime.type} ?: 'N/A'"></td>
            <td th:text="${anime.episodes} ?: '-'"></td>
            <td th:text="${anime.score != 0} ? ${anime.score} : 'N/A'"></td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-4">
        <div>
            <a th:if="${pagination.currentPage > 1}"
               th:href="@{/anime/search(q=${query}, page=${pagination.currentPage - 1})}"
               class="btn btn-outline-primary btn-sm me-2">Previous</a>
        </div>
        <div class="text-center">
        <span class="fw-bold">
            <span th:text="${pagination.currentPage}"></span> /
            <span th:text="${pagination.lastVisiblePage}"></span>
        </span>
        </div>
        <div>
            <a th:if="${pagination.hasNextPage}"
               th:href="@{/anime/search(q=${query}, page=${pagination.currentPage + 1})}"
               class="btn btn-outline-primary btn-sm ms-2">Next</a>
        </div>
    </div>
</div>
</body>
</html>
