<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js" defer></script>
</head>
<body>
<div th:fragment="search-bar">
    <div class="row justify-content-center mb-4">
        <div class="col-md-6 col-lg-4 position-relative">
            <div class="input-group">
                <input type="text" id="anime-search-bar" class="form-control form-control-lg"
                       placeholder="Search Anime..." aria-label="Search Anime"
                       aria-describedby="search-addon" autocomplete="off">
            </div>
            <div id="anime-results-dropdown" class="dropdown-menu w-100 shadow mt-1"
                 style="max-height: 300px; overflow-y: auto;">
            </div>
        </div>
    </div>
</div>
</body>
</html>
