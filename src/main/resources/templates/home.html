<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.username} + '\'s Profile - AniLog'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="js/image-upload.js" defer></script>
</head>
<body>
<h1 th:text="${user.username} + '\'s Profile - AniLog'"></h1>
<img th:src="${user.profilePic.url}" th:alt="${user.username} + '\'s profile picture'" style="border-radius: 50%;"
     width="200" height="200">
<br>

<div class="my-5">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <h3>Profile picture updated successfully!</h3>
    </div>
    <div class="mx-auto w-25 " style="max-width:100%;">
        <form th:action="@{/edit-picture}" th:object="${user}" method="POST" enctype="multipart/form-data">
            <div th:if="${uploadSuccess != null && !uploadSuccess}"
                 class="alert alert-danger alert-dismissible fade show" role="alert">
                <p> Image upload failed</p>
            </div>
            <div class="input-group">
                <input type="file" id="image-input" class="form-control" name="image" accept="image/*"
                       aria-describedby="inputGroupFileAddon04"
                       aria-label="Upload">
                <button id="upload-button" class="btn btn-outline-secondary" type="submit" disabled>Submit</button>
            </div>
        </form>
    </div>
</div>
<br>

<div sec:authorize="hasRole('ADMIN')">
    <a class="btn btn-outline-info" th:href="@{/admin/list}" role="button">Admin Page</a>
</div>

<!-- Spring Security automatically handles logout route -->
<form action="#" th:action="@{/logout}" method="POST">
    <input type="submit" value="Logout"/>
</form>
</body>
</html>
