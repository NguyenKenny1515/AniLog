<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - AniLog</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="text-center">
    <div class="card p-5 shadow-lg anilog-card">
        <div class="card-body text-center">
            <h1 class="main-text mb-4">Login</h1>

            <form th:action="@{/authenticateTheUser}" method="POST">

                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-center">
                    Invalid username and password.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show text-center">
                    You have been logged out.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="mb-4">
                    <input type="text" name="username" placeholder="Username" class="form-control" required>
                </div>

                <div class="mb-4">
                    <input type="password" name="password" placeholder="Password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <div class="mt-3">
                <a class="btn btn-outline-primary me-2" th:href="@{/registration}">Sign Up</a>
                <a class="btn btn-secondary" th:href="@{/}">Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
