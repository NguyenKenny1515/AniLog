<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - AniLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Users Directory</h3>
    <hr>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th></th>
            <th>Username</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td>
                <img th:src="${user.profilePic.url}" th:alt="${user.username} + '\'s profile picture'"
                     style="border-radius: 50%;"
                     width="50" height="50">
            </td>
            <td th:text="${user.username}"></td>
            <td th:each="role : ${user.roles}" th:text="${role.authority}">
            <td>
                <!--                <a th:href="@{/showFormForUpdate(username=*{username})}" class="btn btn-info btn-sm">-->
                <!--                    Update-->
                <!--                </a>-->

                <a th:href="@{/admin/delete(username=${user.username})}" class="btn btn-danger btn-sm"
                   onclick="if (!(confirm('Are you sure you want to delete this user?'))) return false">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <a class="btn btn-outline-primary" th:href="@{/profile}" role="button">Profile</a>
</div>
</body>
</html>
