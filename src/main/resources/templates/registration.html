<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AniLog</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script th:src="@{/js/dark-mode.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="toggle-container">
    <button id="toggle-dark-mode" class="toggle-btn">🌙 Dark Mode</button>
</div>

<div class="text-center">
    <div class="card p-5 shadow-lg anilog-card">
        <div class="card-body">
            <h1 class="main-text mb-4">Sign Up</h1>
            <h4 class="mb-4">Join to create your profile, catalog your shows, and more!</h4>
            <hr/>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
                <h4>Account created successfully!</h4>
                <a th:href="@{/login}">Click here to login</a>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/registration}" th:object="${user}" method="POST">
                <div th:if="${#fields.hasErrors('global')}"
                     class="alert alert-danger alert-dismissible fade show text-center"
                     role="alert">
                    <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row mb-4">
                    <label class="col-sm-4 col-form-label">Username*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:field="*{username}" placeholder="Enter Username"/>
                        <p th:if="${#fields.hasErrors('username')}" th:errorclass="text-danger"
                           th:errors="*{username}"></p>
                    </div>
                </div>

                <div class="row mb-4">
                    <label class="col-sm-4 col-form-label">Password*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" th:field="*{password}"
                               placeholder="Enter Password"/>
                        <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger"
                           th:errors="*{password}"></p>
                    </div>
                </div>

                <div class="row mb-4">
                    <label class="col-sm-4 col-form-label">Confirm Password*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" th:field="*{confirmPassword}"
                               placeholder="Confirm Password"/>
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errorclass="text-danger"
                           th:errors="*{confirmPassword}"></p>
                    </div>
                </div>

                <div class="mb-4 text-center">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </div>

                <div class="mb-4 text-center">
                    <p>Already have an account?</p>
                    <a th:href="@{/login}" class="btn btn-outline-primary">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
