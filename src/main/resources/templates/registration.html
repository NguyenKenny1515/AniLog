<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AniLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container py-5">
    <div class="row">
        <div class="col-lg-6 mx-auto rounded border p-4">
            <h1 class="text-center mb-4">Start Using AniLog</h1>
            <h3 class="text-center mb-4">Join us for free to create your own profile, catalog your shows, and much
                more!</h3>
            <hr/>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <h3>Account created successfully!</h3>
                <a th:href="@{/login}">Click here to login</a>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/registration}" th:object="${user}" method="POST" class="form-horizontal">
                <div th:if="${#fields.hasErrors('global')}" class="alert alert-danger alert-dismissible fade show"
                     role="alert">
                    <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Username*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:field="*{username}"/>
                        <p th:if="${#fields.hasErrors('username')}" th:errorclass="text-danger"
                           th:errors="*{username}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Password*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" th:field="*{password}"/>
                        <p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger"
                           th:errors="*{password}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-4 col-form-label">Confirm Password*</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="password" th:field="*{confirmPassword}"/>
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errorclass="text-danger"
                           th:errors="*{confirmPassword}"></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary">Create Account</button>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <p>Already have an account?</p>
                        <a th:href="@{/login}" class="btn btn-outline-primary">Login</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
