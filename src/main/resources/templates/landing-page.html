<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>AniLog</title>

    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="text-center">
    <h1 class="main-text" style="text-shadow: 2px 2px 10px rgba(13, 110, 253, 0.5);">✨ A n i L o g ✨</h1>
    <p class="lead">A simple, minimalistic anime tracker.</p>

    <div>
        <div sec:authorize="isAuthenticated()">
            <a class="btn btn-primary btn-lg me-2" th:href="@{/profile}" role="button">Your Profile</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a class="btn btn-primary btn-lg me-2" th:href="@{/login}" role="button">Login</a>
            <a class="btn btn-primary btn-lg" th:href="@{/registration}" role="button">Register</a>
        </div>
    </div>
</div>
</body>
</html>
